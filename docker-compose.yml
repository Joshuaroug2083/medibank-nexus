# ─── MediBank Nexus — Docker Compose ─────────────────────────────────────────
#
# Services:
#   db        — PostgreSQL 16
#   redis     — Redis 7 (token blacklist, rate limiting)
#   api       — Express REST API (medibank-nexus-api)
#   web       — React SPA served via Nginx (medibank-nexus)
#
# Usage:
#   docker compose up -d           # Start all services in background
#   docker compose logs -f api     # Follow API logs
#   docker compose down -v         # Stop and remove volumes (WARNING: deletes DB data)
#
# First-time setup:
#   1. cp medibank-nexus-api/.env.example medibank-nexus-api/.env
#   2. Edit the .env with real secrets
#   3. docker compose up -d
#   4. docker compose exec api node scripts/migrate.js
#   5. docker compose exec api node scripts/seed.js   # optional demo data

version: "3.9"

# ─── Shared networks ──────────────────────────────────────────────────────────
networks:
  nexus-internal:       # api <-> db/redis (not exposed externally)
    driver: bridge
  nexus-public:         # web <-> api (Nginx proxies to api)
    driver: bridge

# ─── Named volumes ────────────────────────────────────────────────────────────
volumes:
  postgres-data:        # Persistent database data
  redis-data:           # Persistent Redis AOF / RDB data

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: nexus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-medibank}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nexus-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-medibank}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redispass}
      --appendonly yes
      --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - nexus-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Express API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./medibank-nexus-api
      dockerfile: Dockerfile
    container_name: nexus-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:          production
      PORT:              3001
      DB_HOST:           db
      DB_PORT:           5432
      DB_NAME:           ${DB_NAME:-medibank}
      DB_USER:           ${DB_USER:-postgres}
      DB_PASSWORD:       ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_URL:         redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      JWT_SECRET:        ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN:    ${JWT_EXPIRES_IN:-8h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ENCRYPTION_KEY:    ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      CLIENT_ORIGIN:     ${CLIENT_ORIGIN:-http://localhost}
      API_BASE_URL:      ${API_BASE_URL:-http://api:3001}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY:    ${OPENAI_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GOOGLE_CLIENT_ID:  ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOCKOUT_DURATION_MINUTES: ${LOCKOUT_DURATION_MINUTES:-15}
      RATE_LIMIT_GENERAL: ${RATE_LIMIT_GENERAL:-100}
      RATE_LIMIT_AUTH:    ${RATE_LIMIT_AUTH:-10}
    networks:
      - nexus-internal
      - nexus-public
    ports:
      - "${API_PORT:-3001}:3001"   # direct API access (can be removed in prod behind nginx)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── React Frontend (Nginx) ──────────────────────────────────────────────────
  web:
    build:
      context: ./medibank-nexus
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}    # leave empty if using relative paths
    container_name: nexus-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - nexus-public
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
